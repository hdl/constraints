name: Doc

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:

  Doc:
    runs-on: ubuntu-latest
    name: 📓 Doc
    steps:

    - name: 🧰 Checkout
      uses: actions/checkout@v7

    - name: 📮 Clone openFPGALoader
      run: git clone https://github.com/trabucayre/openFPGALoader

    - name: 📓 Build The Docs
      uses: buildthedocs/btd@v0
      with:
        token: ${{ github.token }}
        skip-deploy: ${{ github.event_name == 'pull_request' }}
